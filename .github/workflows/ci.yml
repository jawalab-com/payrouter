name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Tracks the toolchain in go.mod so CI never drifts from local builds.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # -race matters here: the webhook deliverer and the reconciler both run as
        # background goroutines against the shared store.
        run: go test -race ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image must contain config.yaml; a broken build here means the
      # orchestrator would silently fall back to the compiled-in fee schedule.
      - name: build image
        run: docker build -t payrouter:ci .
